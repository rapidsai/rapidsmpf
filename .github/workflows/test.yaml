name: test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: |
          branch: git branch the workflow run targets.
          Required even when 'sha' is provided because it is also used for organizing artifacts.
        required: true
        type: string
      date:
        description: "date: Date (YYYY-MM-DD) this run is for. Used to organize artifacts produced by nightly builds"
        required: true
        type: string
      sha:
        description: "sha: full git commit SHA to check out"
        required: true
        type: string
      build_type:
        description: "build_type: one of [branch, nightly, pull-request]"
        type: string
        default: nightly

permissions: {}

jobs:
  conda-cpp-tests:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      date: ${{ inputs.date }}
      matrix_filter: map(select(.GPU != "gb300"))
      script: ci/test_cpp.sh
      sha: ${{ inputs.sha }}
  conda-cpp-tests-gb300:
    # Until nvbug 6565551 is fixed, multi-process virtualised runs on GB300
    # can put the GPU in an unrecoverable state in the VM if two processes
    # initialise a cuda context simultaneously. Hence we make the tests on
    # GB300 optional.
    if: inputs.build_type != 'pull-request'
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      continue-on-error: true
      date: ${{ inputs.date }}
      matrix_filter: map(select(.GPU == "gb300"))
      script: ci/test_cpp.sh
      sha: ${{ inputs.sha }}
  conda-cpp-memcheck:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      date: ${{ inputs.date }}
      node_type: "gpu-rtxpro6000-latest-1"
      script: ci/test_cpp_memcheck.sh
      sha: ${{ inputs.sha }}
  conda-python-tests:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      date: ${{ inputs.date }}
      matrix_filter: map(select(.GPU != "gb300"))
      run_codecov: false
      script: ci/test_python.sh
      sha: ${{ inputs.sha }}
  conda-python-tests-gb300:
    # Until nvbug 6565551 is fixed, multi-process virtualised runs on GB300
    # can put the GPU in an unrecoverable state in the VM if two processes
    # initialise a cuda context simultaneously. Hence we make the tests on
    # GB300 optional.
    if: inputs.build_type != 'pull-request'
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      continue-on-error: true
      date: ${{ inputs.date }}
      matrix_filter: map(select(.GPU == "gb300"))
      run_codecov: false
      script: ci/test_python.sh
      sha: ${{ inputs.sha }}
  wheel-test:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    with:
      build_type: ${{ inputs.build_type }}
      branch: ${{ inputs.branch }}
      container-options: "--cap-add CAP_SYS_PTRACE --shm-size=8g --ulimit=nofile=1000000:1000000"
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      script: ci/test_wheel.sh
